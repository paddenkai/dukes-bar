<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Duke's Bar">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06222b">
<title>Duke's Bar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06222b; --bg2:#0a3540; --panel:#0e404d; --panel2:#10485a;
  --cream:#f7f1e4; --gold:#f2b950; --coral:#ff7a52; --leaf:#52c08a;
  --muted:#7fa0a6; --line:rgba(255,255,255,.09);
}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--cream);font-size:17px;min-height:100vh}
.screen{display:none}
.screen.active{display:block}
.hidden{display:none!important}
mark{background:rgba(242,185,80,.32);color:var(--cream);border-radius:3px;padding:0 1px}

/* ============ HOME ============ */
#home{min-height:100vh;display:flex;flex-direction:column;padding:30px 18px 40px;
  background:radial-gradient(circle at 20% 8%,rgba(242,185,80,.14),transparent 45%),
             radial-gradient(circle at 85% 92%,rgba(255,122,82,.13),transparent 48%),var(--bg)}
.home-top{text-align:center;margin:18px 0 30px}
.home-top .kick{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.home-top h1{font-size:clamp(38px,12vw,58px);font-weight:800;letter-spacing:-.03em;line-height:.92;margin:8px 0}
.home-top h1 span{color:var(--coral)}
.home-top .stats{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-top:8px}
.tiles{display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto}
.tile{display:flex;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);border-radius:20px;padding:22px 20px;cursor:pointer;color:var(--cream);font-family:inherit;transition:.16s;background:linear-gradient(150deg,var(--bg2),var(--panel))}
.tile:active{transform:scale(.985)}
.tile .emo{font-size:34px;flex:0 0 auto;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-radius:16px}
.tile .tt{flex:1}
.tile .tt h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tile .tt p{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.tile .arr{font-size:20px;color:var(--gold);opacity:.7}
.tile.fav{background:linear-gradient(150deg,rgba(242,185,80,.14),rgba(255,122,82,.08));border-color:rgba(242,185,80,.3)}
.home-foot{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);opacity:.6;margin-top:auto;padding-top:30px}

/* ============ APP BAR (book/study) ============ */
.appbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 72%,rgba(6,34,43,.96));backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 12px 10px}
.appbar-row{display:flex;align-items:center;gap:10px}
.back{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:12px;color:var(--cream);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.appbar h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.appbar h2 span{color:var(--coral)}

/* search */
.searchwrap{position:relative;flex:1}
#search{width:100%;font-family:inherit;font-size:17px;font-weight:600;color:var(--cream);background:var(--panel);border:1.5px solid var(--line);border-radius:13px;padding:13px 40px 13px 40px;outline:none;transition:.15s}
#search::placeholder{color:var(--muted);font-weight:500}
#search:focus{border-color:var(--gold);background:var(--panel2)}
.searchwrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;pointer-events:none}
.clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--cream);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center}
.clearbtn.show{display:flex}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.filterrow{display:flex;align-items:center;gap:8px;padding:10px 0 2px}
.favbtn{flex:0 0 auto;width:42px;height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:17px;border-radius:30px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.favbtn.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--cream);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:7px 13px;border-radius:30px;cursor:pointer;transition:.15s;opacity:.7;white-space:nowrap}
.chip.active{background:var(--gold);color:var(--bg);border-color:var(--gold);opacity:1;font-weight:500}
.chip.star.active{background:var(--gold)}
.chip.star{color:var(--gold);opacity:.9}

/* sort segmented */
.segwrap{display:flex;align-items:center;gap:10px;padding:8px 2px 2px}
.seg{display:inline-flex;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;color:var(--cream);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:8px;cursor:pointer;opacity:.6}
.seg button.on{background:var(--panel2);opacity:1;font-weight:500;color:var(--gold)}
.seglbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ============ BOOK LIST ============ */
.list{padding:8px 12px 90px;max-width:680px;margin:0 auto}
.count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);padding:8px 4px;letter-spacing:.08em}
.grouphead{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding:18px 6px 8px}
.row{background:var(--bg2);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;overflow:hidden;transition:.15s}
.row.open{border-color:rgba(242,185,80,.45);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.rowhead{display:flex;align-items:center;gap:11px;padding:15px 15px;cursor:pointer}
.star{flex:0 0 auto;width:30px;height:30px;border:0;background:transparent;font-size:20px;cursor:pointer;line-height:1;color:var(--muted);opacity:.55;transition:.15s}
.star.on{color:var(--gold);opacity:1}
.rowhead .name{font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;line-height:1.15}
.rowhead .price{color:var(--gold);font-size:15px;font-weight:500;font-family:'DM Mono',monospace}
.kind{flex:0 0 auto;white-space:nowrap;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--muted)}
.kind.f{color:#ffd089;background:rgba(242,185,80,.13)}
.kind.t{color:#9fe0c0;background:rgba(82,192,138,.13)}
.kind.c{color:#ffb59a;background:rgba(255,122,82,.13)}
.kind.s{color:#a9d4ff;background:rgba(120,180,255,.14)}
.kind.m{color:#ffb3d1;background:rgba(255,120,170,.18)}
.kind.sh{color:#c9b3ff;background:rgba(160,120,255,.18)}
.offrail{color:var(--gold);font-size:13px;opacity:.85;margin-left:1px}
.offrail-note{margin-top:14px;font-size:13px;color:var(--muted);background:rgba(242,185,80,.08);border:1px solid rgba(242,185,80,.22);border-radius:10px;padding:9px 12px;line-height:1.45}
.offrail-note b{color:var(--gold);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.chev{font-size:12px;opacity:.5;transition:.2s}
.row.open .chev{transform:rotate(180deg);opacity:.9}
.detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
.row.open .detail{max-height:1400px}
.detail-in{padding:2px 16px 18px;border-top:1px solid var(--line)}
.specrow{display:flex;gap:12px;margin:14px 0 4px}
.spec{flex:1;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px}
.spec .l{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:3px}
.spec .v{font-size:14.5px;font-weight:600;line-height:1.25}
.ing-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.85;margin:16px 0 8px}
.ing{display:flex;align-items:baseline;gap:11px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.ing:last-child{border-bottom:0}
.ing .amt{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--gold);flex:0 0 auto;min-width:62px}
.ing .nm{font-size:16px;font-weight:600}
.ing .note{font-size:13px;color:var(--coral);font-weight:600;margin-left:4px}
.allergy{margin-top:14px;font-size:13px;color:var(--muted);background:rgba(255,122,82,.08);border:1px solid rgba(255,122,82,.2);border-radius:10px;padding:9px 12px;line-height:1.4}
.allergy b{color:#ffb59a;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.notes-line{font-size:14px;color:var(--cream);line-height:1.5;margin-top:4px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}

/* ============ STUDY ============ */
.swrap{max-width:680px;margin:0 auto;padding:14px 14px 80px}
.tabs{display:flex;gap:8px;background:rgba(0,0,0,.22);padding:6px;border-radius:16px;margin:4px 0 16px;border:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;color:var(--cream);font-family:inherit;font-weight:700;font-size:14px;padding:11px 8px;border-radius:11px;cursor:pointer;transition:.2s;opacity:.65}
.tab.active{background:linear-gradient(135deg,var(--coral),#ff9466);opacity:1;box-shadow:0 6px 18px rgba(255,122,82,.32)}
.bar{height:6px;background:rgba(0,0,0,.25);border-radius:10px;overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--gold));width:0;transition:.4s}
.scount{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px}
.card-area{margin-bottom:18px}
.card{position:relative;width:100%}
.face{width:100%;box-sizing:border-box;border-radius:24px;padding:28px 24px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);min-height:380px;cursor:pointer}
.front{display:flex;flex-direction:column;background:linear-gradient(165deg,#fff,var(--cream));color:#0c2128}
.back{display:none;background:linear-gradient(165deg,var(--panel),var(--bg));overflow-y:auto;max-height:74vh}
.card.flip .front{display:none}
.card.flip .back{display:block}
.card:not(.flip) .front,.card.flip .back{animation:cardin .22s ease}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.face .tag{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);margin-bottom:14px}
.back .tag{color:var(--gold)}
.q-name{font-size:clamp(26px,7vw,38px);font-weight:800;line-height:1.02;letter-spacing:-.02em}
.front .hint{margin-top:auto;font-family:'DM Mono',monospace;font-size:12px;color:#6e8a8f}
.detailc{margin:0 0 13px}
.detailc .lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:3px}
.detailc .val{font-size:15px;line-height:1.4;font-weight:500}
.recipe{white-space:pre-line;font-size:14.5px;line-height:1.55}
.scroll{overflow-y:auto;flex:1}
.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:6px}
.nav{display:flex;gap:10px}
.btn{flex:1;border:0;font-family:inherit;font-weight:700;font-size:15px;padding:15px;border-radius:15px;cursor:pointer;transition:.18s;background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line)}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:linear-gradient(135deg,var(--coral),#ff9466);border:0;box-shadow:0 6px 18px rgba(255,122,82,.3)}
.btn:active{transform:translateY(1px)}
.quiz-card,.build-card{background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.qcat{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.qtext{font-size:clamp(20px,5.5vw,27px);font-weight:700;line-height:1.2;margin-bottom:22px;letter-spacing:-.01em}
.qtext small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:6px;font-family:'DM Mono',monospace}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);font-family:inherit;font-size:15.5px;font-weight:500;padding:15px 16px;border-radius:14px;cursor:pointer;transition:.15s;line-height:1.3}
.opt:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.opt:disabled{cursor:default}
.opt.correct{background:rgba(82,192,138,.28);border-color:var(--leaf);color:#cdf4dd}
.opt.wrong{background:rgba(255,122,82,.22);border-color:var(--coral)}
.opt.sel{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
.score{display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:14px}
.score b{color:var(--gold)}
.feedback{margin-top:18px;text-align:center;min-height:24px;font-weight:700;font-size:16px}
.feedback.ok{color:var(--leaf)}.feedback.no{color:var(--coral)}
.next-wrap{margin-top:16px}
.results{text-align:center;padding:18px 0}
.results .big{font-size:60px;font-weight:800;color:var(--gold);line-height:1}
.results p{color:var(--muted);margin:8px 0 22px;font-size:15px}
.build-sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}
.build-head{font-size:clamp(24px,6.5vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1}
.section-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:20px 0 9px}
.glassbox{min-height:46px;border:1.5px dashed rgba(255,255,255,.2);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;background:rgba(0,0,0,.14)}
.glassbox.empty::before{content:"tap ingredients below to add";font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);opacity:.6;padding:6px}
.pour{display:inline-flex;align-items:center;gap:8px;background:rgba(82,192,138,.2);border:1px solid var(--leaf);color:#cdf4dd;font-size:13.5px;font-weight:600;padding:7px 11px;border-radius:30px;cursor:pointer;animation:pop .2s}
.pour .x{opacity:.55;font-weight:700}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.tiles2{display:flex;flex-wrap:wrap;gap:8px}
.tile2{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--cream);font-family:inherit;font-size:13.5px;font-weight:500;padding:9px 13px;border-radius:12px;cursor:pointer;transition:.14s}
.tile2:hover:not(:disabled){background:rgba(255,255,255,.12)}
.tile2.used{opacity:.3;text-decoration:line-through;cursor:default}
.tile2:disabled{cursor:default}
.grid2{display:flex;flex-wrap:wrap;gap:8px}
.grid2 .opt{flex:1;min-width:140px;text-align:center}
.reveal{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.reveal .line{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin-bottom:6px;line-height:1.4}
.reveal .mk{font-weight:800;flex-shrink:0}
.mk.ok{color:var(--leaf)}.mk.no{color:var(--coral)}
.reveal .answer{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);margin-top:4px;padding-left:24px;white-space:pre-line}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <div class="home-top">
    <div class="kick">Duke's Malibu</div>
    <h1>Bar<span>Book</span></h1>
    <div class="stats" id="homeStats"></div>
  </div>
  <div class="tiles">
    <button class="tile" data-go="book">
      <span class="emo">🍹</span>
      <span class="tt"><h2>Bar Book</h2><p>Find any drink fast — full build &amp; method</p></span>
      <span class="arr">→</span>
    </button>
    <button class="tile" data-go="study">
      <span class="emo">📇</span>
      <span class="tt"><h2>Study</h2><p>Flashcards · Quiz · Build it yourself</p></span>
      <span class="arr">→</span>
    </button>
    <button class="tile fav" data-go="faves">
      <span class="emo">⭐</span>
      <span class="tt"><h2>Favorites</h2><p>Your starred drinks, all in one place</p></span>
      <span class="arr">→</span>
    </button>
  </div>
  <div class="home-foot">study sober, serve sharp 🌺</div>
</section>

<!-- ============ BOOK ============ -->
<section id="book" class="screen">
  <div class="appbar">
    <div class="appbar-row">
      <button class="back" data-go="home">←</button>
      <div class="searchwrap">
        <span class="ico">🔍</span>
        <input id="search" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Search drink or ingredient…">
        <button class="clearbtn" id="clear">×</button>
      </div>
    </div>
    <div class="filterrow">
      <button class="favbtn" id="bookFavBtn" aria-label="Favorites">★</button>
      <div class="chips" id="bookChips"></div>
    </div>
    <div class="segwrap">
      <span class="seglbl">View</span>
      <div class="seg" id="sortSeg">
        <button data-sort="az" class="on">A–Z</button>
        <button data-sort="type">By Type</button>
      </div>
    </div>
  </div>
  <div class="list">
    <div class="count" id="bookCount"></div>
    <div id="bookResults"></div>
  </div>
</section>

<!-- ============ STUDY ============ -->
<section id="study" class="screen">
  <div class="appbar">
    <div class="appbar-row">
      <button class="back" data-go="home">←</button>
      <h2>Study<span>.</span></h2>
    </div>
    <div class="filterrow">
      <button class="favbtn" id="studyFavBtn" aria-label="Study favorites">★</button>
      <div class="chips" id="studyChips"></div>
    </div>
  </div>
  <div class="swrap">
    <div class="tabs">
      <button class="tab active" data-mode="cards">📇 Cards</button>
      <button class="tab" data-mode="quiz">⚡ Quiz</button>
      <button class="tab" data-mode="build">🍹 Build</button>
    </div>
    <section id="cardsView">
      <div class="bar"><i id="cardProg"></i></div>
      <div class="scount" id="cardCount"></div>
      <div class="card-area"><div class="card" id="card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div></div>
      <div class="nav">
        <button class="btn" id="prev">← Prev</button>
        <button class="btn primary" id="flip">Flip</button>
        <button class="btn" id="next">Next →</button>
      </div>
    </section>
    <section id="quizView" class="hidden">
      <div class="score"><span>Question <b id="qNum">1</b></span><span>Score <b id="qScore">0</b></span></div>
      <div class="bar"><i id="quizProg"></i></div>
      <div style="height:14px"></div>
      <div id="quizBody"></div>
    </section>
    <section id="buildView" class="hidden">
      <div class="score"><span>Build <b id="bNum">1</b></span><span>Score <b id="bScore">0</b></span></div>
      <div class="bar"><i id="buildProg"></i></div>
      <div style="height:14px"></div>
      <div id="buildBody"></div>
    </section>
  </div>
</section>

<script>
const DATA = {
  "My Drinks": [

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

const BOOK_FILTERS=[["All",null],["Cocktails","cocktail"],["My Drinks","My Drinks"],["Standards","Standards"],["Shots","Shots"],["Featured","Featured"],["Tiki","Tiki"],["Classics","Classics"],["Spirits","Liquor Prices"],["Beer & Wine","Beer & Wine"]];
let bookCat=null, bookFav=false, bookSort="az", bookQuery="", openName=null;

const FAMILY_ORDER=["Bourbon","Whiskey","Scotch","Vodka","Gin","Tequila & Mezcal","Rum","Brandy & Cognac","Liqueurs & Apéritifs"];
function spiritFamily(cat){
  const c=(cat||"").toLowerCase();
  if(c.includes("bourbon"))return"Bourbon";
  if(c.includes("scotch"))return"Scotch";
  if(c.includes("rye")||c.includes("tennessee")||c.includes("irish")||c.includes("canadian")||c.includes("whisk"))return"Whiskey";
  if(c.includes("vodka"))return"Vodka";
  if(c.includes("gin"))return"Gin";
  if(c.includes("tequila")||c.includes("mezcal"))return"Tequila & Mezcal";
  if(c.includes("rum"))return"Rum";
  if(c.includes("cognac")||c.includes("brandy"))return"Brandy & Cognac";
  return"Liqueurs & Apéritifs";
}
function glabel(k){return k==="Liquor Prices"?"Spirits":k}
function byName(a,b){return a.n.localeCompare(b.n)}
function buildSections(items){
  if(bookSort!=="type")return null;
  const secs=[];
  const pushFamilies=arr=>FAMILY_ORDER.forEach(f=>{const g=arr.filter(it=>spiritFamily(it.cat)===f).sort(byName);if(g.length)secs.push({label:f,items:g})});
  if(bookCat===null){
    CATKEYS.forEach(k=>{
      const grp=items.filter(it=>it._cat===k);
      if(!grp.length)return;
      if(k==="Liquor Prices")pushFamilies(grp);
      else secs.push({label:glabel(k),items:grp.sort(byName)});
    });
  } else if(bookCat==="Liquor Prices"){
    pushFamilies(items);
  } else if(bookCat==="cocktail"){
    ["My Drinks","Featured","Tiki","Classics","Standards","Shots"].forEach(k=>{const g=items.filter(it=>it._cat===k).sort(byName);if(g.length)secs.push({label:k,items:g})});
  } else {
    secs.push({label:glabel(bookCat),items:items.slice().sort(byName)});
  }
  return secs;
}

function renderBookChips(){
  const c=$("#bookChips"); c.innerHTML="";
  BOOK_FILTERS.forEach(([label,val])=>{
    const b=document.createElement("button");
    b.className="chip"+((bookCat===val)?" active":""); b.textContent=label;
    b.onclick=()=>{bookCat=val;renderBookChips();renderBook()};
    c.appendChild(b);
  });
  $("#bookFavBtn").classList.toggle("on",bookFav);
}
$("#bookFavBtn").onclick=()=>{bookFav=!bookFav;renderBookChips();renderBook()};
$("#sortSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{

});

function matchBookCat(it){
  if(bookCat===null)return true;
  if(bookCat==="cocktail")return typeOf(it)==="cocktail";
  return it._cat===bookCat;
}
function matchQuery(it,q){
  if(!q)return true; q=q.toLowerCase();
  return [it.n,it.recipe,it.cat,it.notes,it.region].some(x=>x&&x.toLowerCase().includes(q));
}
function hl(text,q){
  if(!q)return esc(text);
  q=q.toLowerCase(); const lt=text.toLowerCase(); let out="",i=0;
  while(true){const idx=lt.indexOf(q,i);if(idx<0){out+=esc(text.slice(i));break}out+=esc(text.slice(i,idx))+"<mark>"+esc(text.slice(idx,idx+q.length))+"</mark>";i=idx+q.length}
  return out;
}
function parseIng(line){
  const noteM=line.match(/\(([^)]+)\)/); const note=noteM?noteM[1]:"";
  let body=line.replace(/\s*\([^)]*\)/,"").trim();
  const m=body.match(/^([\d.]+\s*(?:oz|dash(?:es)?|tsp)|Equal parts|Top with|[\d.]+)\b\s*(.*)$/i);
  if(m)return{amt:m[1].replace(/\s+/,' '),nm:m[2],note};
  return{amt:"",nm:body,note};
}
function buildDetail(it){
  const t=typeOf(it);
  if(t==="cocktail"){
    const lines=it.recipe.split("\n").filter(l=>l.trim());
    const real=lines.filter(l=>!/—\s*N\/A/.test(l)); const naLine=lines.find(l=>/—\s*N\/A/.test(l));
    const parsed=real.map(parseIng); const ings=parsed.filter(p=>p.nm); const notes=parsed.filter(p=>!p.nm&&p.note);
    return `<div class="specrow">
        <div class="spec"><div class="l">Glass</div><div class="v">${esc(it.glass)}</div></div>
        <div class="spec"><div class="l">Garnish</div><div class="v">${esc(it.garnish)}</div></div></div>
      <div class="ing-lbl">Build</div>
      ${ings.map(g=>`<div class="ing"><span class="amt">${esc(g.amt)||"—"}</span><span class="nm">${esc(g.nm)}${g.note?`<span class="note"> · ${esc(g.note)}</span>`:""}</span></div>`).join("")}
      ${notes.map(p=>`<div class="notes-line" style="color:var(--gold);margin-top:8px">💡 ${esc(p.note)}</div>`).join("")}
      ${METHODS[it.n]?`<div class="ing-lbl">Method</div><div class="notes-line">${esc(METHODS[it.n])}</div>`:""}
      ${naLine?`<div class="notes-line" style="color:var(--leaf);margin-top:10px">🚫 Non-alcoholic</div>`:""}
      ${it.allergy&&it.allergy!=="—"?`<div class="allergy"><b>Allergy</b><br>${esc(it.allergy)}</div>`:""}
      ${it.special?`<div class="offrail-note"><b>\u2691 Off Duke\u2019s rail</b><br>Needs: ${esc(it.special)}</div>`:""}`;
  }
  if(t==="liquor"){
    const base=parseInt(it.price.replace("$",""))||0;
    return `<div class="specrow">
        <div class="spec"><div class="l">Single Pour</div><div class="v" style="color:var(--gold);font-size:22px">${esc(it.price)}</div></div>
        <div class="spec"><div class="l">Double</div><div class="v" style="font-size:22px">$${base*2}</div></div></div>
      <div class="notes-line">${esc(it.cat)}</div>`;
  }
  return `<div class="specrow">
      <div class="spec"><div class="l">Type</div><div class="v">${esc(it.cat)}</div></div>
      <div class="spec"><div class="l">Origin</div><div class="v">${esc(it.region)}</div></div></div>
    <div class="ing-lbl">Tasting Notes</div><div class="notes-line">${esc(it.notes)}</div>`;
}
function rowHTML(it,q){
  const t=typeOf(it);
  const kcls=KIND[it._cat]||(t==="liquor"?"s":"");
  let klabel=KINDLABEL[it._cat]||"";
  if(t==="liquor")klabel=(it.cat||"Spirit").replace(/\s*\(well\)/i,"");
  else if(t==="bw")klabel=it.cat||"Beer/Wine";
  const meta=(t==="liquor"||it.price)?`<span class="price">${esc(it.price)}</span>`:"";
  const open=it.n===openName, fav=isFav(it.n);
  return `<div class="row${open?" open":""}" data-name="${esc(it.n)}">
    <div class="rowhead">
      <button class="star${fav?" on":""}" data-fav="${esc(it.n)}">${fav?"★":"☆"}</button>
      <span class="kind ${kcls}">${esc(klabel)}</span>
      <span class="name">${hl(it.n,q)}${it.special?' <span class="offrail">\u2691</span>':""}</span>${meta}
      <span class="chev">▼</span>
    </div>
    <div class="detail"><div class="detail-in">${open?buildDetail(it):""}</div></div>
  </div>`;
}
function renderBook(){
  const q=bookQuery;
  let items=ITEMS.filter(it=>matchBookCat(it)&&matchQuery(it,q));
  if(bookFav)items=items.filter(it=>isFav(it.n));
  $("#bookCount").textContent=items.length+(items.length===1?" result":" results")+(bookFav?" · ★ favorites":"");
  const box=$("#bookResults");
  if(items.length===0){
    box.innerHTML=`<div class="empty"><div class="big">${bookFav?"⭐":"🍹"}</div>${bookFav?"No favorites yet.<br>Tap the ☆ on any drink to save it here.":"No drink found.<br>Try a different name or ingredient."}</div>`;
    return;
  }
  const secs=buildSections(items);
  if(secs){
    box.innerHTML=secs.map(s=>`<div class="grouphead">${esc(s.label)}</div>`+s.items.map(it=>rowHTML(it,q)).join("")).join("");
  } else {
    box.innerHTML=items.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(it=>rowHTML(it,q)).join("");
  }
  // handlers
  box.querySelectorAll(".star").forEach(s=>s.onclick=e=>{e.stopPropagation();toggleFav(s.dataset.fav);renderBook()});
  box.querySelectorAll(".row").forEach(row=>{
    row.querySelector(".rowhead").onclick=e=>{
      if(e.target.closest(".star"))return;
      const nm=row.dataset.name; openName=(openName===nm)?null:nm; renderBook();
      if(openName===nm){const el=box.querySelector(`.row[data-name="${nm.replace(/"/g,'\\"')}"]`);if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"nearest"}),60)}
    };
  });
}
const search=$("#search"), clearBtn=$("#clear");
search.addEventListener("input",()=>{bookQuery=search.value.trim();clearBtn.classList.toggle("show",!!bookQuery);openName=null;renderBook()});
clearBtn.onclick=()=>{search.value="";bookQuery="";clearBtn.classList.remove("show");search.focus();renderBook()};
renderBookChips();

/* =================== STUDY =================== */
const SCATS=["All","My Drinks","Featured","Tiki","Classics","Standards","Shots","Liquor Prices","Beer & Wine"];
let mode="cards", scat="All", idx=0, deck=[];
function catItems(cat){
  if(cat==="★ Faves")return ITEMS.filter(it=>isFav(it.n));
  if(cat==="All")return ITEMS;
  return DATA[cat]||[];
}
const studyChips=$("#studyChips");
function renderStudyChips(){
  studyChips.innerHTML="";
  SCATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+((c===scat)?" active":"");
    b.textContent=c==="Liquor Prices"?"Spirits":c;
    b.onclick=()=>{scat=c;renderStudyChips();resetStudy()};
    studyChips.appendChild(b);
  });
  $("#studyFavBtn").classList.toggle("on",scat==="★ Faves");
}
$("#studyFavBtn").onclick=()=>{scat=(scat==="★ Faves")?"All":"★ Faves";renderStudyChips();resetStudy()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  mode=t.dataset.mode;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  $("#cardsView").classList.toggle("hidden",mode!=="cards");
  $("#quizView").classList.toggle("hidden",mode!=="quiz");
  $("#buildView").classList.toggle("hidden",mode!=="build");
  resetStudy();
});
function resetStudy(){ idx=0; if(mode==="build"){startBuild();return} deck=shuffle(catItems(scat)); if(mode==="cards")renderCard(); else startQuiz(); }

// ---- flashcards
const card=$("#card");
function renderCard(){
  if(!deck.length){$("#front").innerHTML=`<div class="tag">Empty</div><div class="q-name">Nothing here yet</div><div class="hint">star some drinks to study faves</div>`;$("#back").innerHTML="";$("#cardCount").textContent="0 / 0";$("#cardProg").style.width="0%";return}
  card.classList.remove("flip");
  const it=deck[idx], t=typeOf(it); let frontTag, back;
  if(t==="cocktail"){
    const cn=it._cat||(DATA["My Drinks"].includes(it)?"My Drinks":DATA.Featured.includes(it)?"Featured":DATA.Tiki.includes(it)?"Tiki":DATA.Classics.includes(it)?"Classics":DATA.Standards.includes(it)?"Standards":DATA.Shots.includes(it)?"Shots":"");
    frontTag=it.price?("Featured · "+it.price):cn==="My Drinks"?"My Drink":cn==="Tiki"?"Tiki Cocktail":cn==="Classics"?"Classic Cocktail":cn==="Standards"?"Bar Standard":cn==="Shots"?"Shot":"Cocktail";
    back=`<div class="tag">Recipe — ${esc(it.n)}</div>
      <div class="detailc"><div class="lbl">Glass</div><div class="val">${esc(it.glass)}</div></div>
      <div class="detailc"><div class="lbl">Garnish</div><div class="val">${esc(it.garnish)}</div></div>
      ${it.allergy&&it.allergy!=="—"?`<div class="detailc"><div class="lbl">Allergy</div><div class="val">${esc(it.allergy)}</div></div>`:""}
      <div class="detailc"><div class="lbl">Build</div><div class="recipe">${esc(it.recipe)}</div></div>
      ${METHODS[it.n]?`<div class="detailc"><div class="lbl">Method</div><div class="val">${esc(METHODS[it.n])}</div></div>`:""}`;
  } else if(t==="liquor"){
    frontTag=it.cat;
    back=`<div class="tag">${esc(it.cat)}</div>
      <div class="detailc"><div class="lbl">Pour</div><div class="val" style="font-size:34px;font-weight:800;color:var(--gold)">${esc(it.price)}</div></div>
      <div class="detailc"><div class="lbl">Double</div><div class="val">$${(parseInt(it.price.slice(1))||0)*2}</div></div>`;
  } else {
    frontTag=it.cat;
    back=`<div class="tag">${esc(it.cat)}</div>
      <div class="detailc"><div class="lbl">Region</div><div class="val">${esc(it.region)}</div></div>
      <div class="detailc"><div class="lbl">Tasting Notes</div><div class="val">${esc(it.notes)}</div></div>`;
  }
  $("#front").innerHTML=`<div class="tag">${esc(frontTag)}</div><div class="q-name">${esc(it.n)}</div><div class="hint">tap to flip ↻</div>`;
  $("#back").innerHTML=back;
  $("#cardCount").textContent=`${idx+1} / ${deck.length}`;
  $("#cardProg").style.width=((idx+1)/deck.length*100)+"%";
}
card.onclick=()=>card.classList.toggle("flip");
$("#flip").onclick=e=>{e.stopPropagation();card.classList.toggle("flip")};
$("#next").onclick=()=>{if(deck.length){idx=(idx+1)%deck.length;renderCard()}};
$("#prev").onclick=()=>{if(deck.length){idx=(idx-1+deck.length)%deck.length;renderCard()}};

// ---- quiz
let qList=[],qPos=0,score=0;
function firstSpirit(r){return r.split("\n")[0].replace(/^[\d.\s]+oz\s*/i,"").replace(/\s*\(.*\)/,"").trim()}
function uniqPrices(pool,exc){return[...new Set(pool.map(x=>x.price).filter(p=>p&&p!==exc))]}
function mc(q,sub,correct,wrongs){wrongs=[...new Set(wrongs.filter(w=>w&&w!==correct))];return{q,sub,correct,opts:shuffle([correct,...shuffle(wrongs).slice(0,3)])}}
function makeQuestions(){
  const pool=catItems(scat); const qs=[];
  pool.forEach(it=>{
    const t=typeOf(it);
    if(t==="cocktail"){
      qs.push(mc(`What's the glassware for the ${it.n}?`,it.price||"",it.glass,pool.filter(x=>x.glass&&x.glass!==it.glass).map(x=>x.glass)));
      if(it.price)qs.push(mc(`What's the price of the ${it.n}?`,"",it.price,["$10","$11","$15","$16","$17","$13"].filter(p=>p!==it.price)));
      const others=pool.filter(x=>x.recipe&&x.n!==it.n);
      qs.push(mc(`Which is a key ingredient in the ${it.n}?`,it.glass,firstSpirit(it.recipe),others.map(x=>firstSpirit(x.recipe)).filter(Boolean)));
    } else if(t==="liquor"){
      qs.push(mc(`What's the pour price of ${it.n}?`,it.cat,it.price,uniqPrices(pool,it.price)));
    } else {
      qs.push(mc(`What region is ${it.n} from?`,it.cat,it.region,pool.filter(x=>x.region&&x.region!==it.region).map(x=>x.region)));
      qs.push(mc(`What category is ${it.n}?`,it.region,it.cat,pool.filter(x=>x.cat!==it.cat).map(x=>x.cat)));
    }
  });
  return shuffle(qs).slice(0,20);
}
function startQuiz(){qList=makeQuestions();qPos=0;score=0;renderQ()}
function renderQ(){
  if(!qList.length){$("#quizBody").innerHTML=`<div class="quiz-card"><div class="qcat">Quiz</div><div class="qtext">Nothing to quiz here.<small>Star some drinks or pick another category.</small></div></div>`;$("#quizProg").style.width="0%";return}
  if(qPos>=qList.length)return showResults();
  const q=qList[qPos];
  $("#qNum").textContent=qPos+1;$("#qScore").textContent=score;$("#quizProg").style.width=(qPos/qList.length*100)+"%";
  $("#quizBody").innerHTML=`<div class="quiz-card">
    <div class="qtext">${esc(q.q)}${q.sub?`<small>${esc(q.sub)}</small>`:""}</div>
    <div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="next-wrap hidden" id="nw"><button class="btn primary" id="nextQ">Next →</button></div></div>`;
  $("#quizBody").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(btn,q){
  const ok=btn.textContent===q.correct;
  $("#quizBody").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add("correct");else if(b===btn)b.classList.add("wrong")});
  const fb=$("#fb");
  if(ok){score++;$("#qScore").textContent=score;fb.textContent="Correct 🌺";fb.className="feedback ok"}
  else{fb.textContent=`Nope — it's ${q.correct}`;fb.className="feedback no"}
  $("#nw").classList.remove("hidden");$("#nextQ").onclick=()=>{qPos++;renderQ()};
}
function showResults(){
  const pct=Math.round(score/qList.length*100);
  const msg=pct>=90?"Bar-ready. 🍹":pct>=70?"Solid — tighten the misses.":pct>=50?"Getting there. Run it again.":"Back to the flashcards, then retry.";
  $("#quizProg").style.width="100%";
  $("#quizBody").innerHTML=`<div class="quiz-card results"><div class="big">${pct}%</div><p>${score} / ${qList.length} correct<br>${msg}</p><button class="btn primary" id="again">Run it again</button></div>`;
  $("#again").onclick=startQuiz;
}

// ---- build
let bList=[],bPos=0,bScore=0,bState=null;
const ALL_ING=[...new Set(COCKTAILS.flatMap(c=>c.build))];
const ALL_GLASS=[...new Set(COCKTAILS.map(c=>c.glass))];
const ALL_GARN=[...new Set(COCKTAILS.map(c=>c.garnish))];
function cocktailPool(){
  let base;
  if(scat==="★ Faves")base=ITEMS.filter(it=>isFav(it.n));
  else if(scat==="All"||!DATA[scat])base=COCKTAILS;
  else base=DATA[scat];
  return base.filter(c=>c.build&&c.build.length>=2);
}
function startBuild(){
  bList=shuffle(cocktailPool()); bPos=0;bScore=0;
  if(!bList.length){$("#buildProg").style.width="0%";$("#bNum").textContent="0";$("#bScore").textContent="0";
    $("#buildBody").innerHTML=`<div class="build-card"><div class="build-sub">Build Mode</div><div class="build-head" style="font-size:22px">No cocktails here</div><p style="color:var(--muted);margin-top:12px;font-size:14px;line-height:1.5">Pick a cocktail category (or star a few drinks) to build.</p></div>`;return}
  renderBuild();
}
function renderBuild(){
  if(bPos>=bList.length)return buildResults();
  const c=bList[bPos];
  bState={added:[],glass:null,garnish:null,checked:false};
  $("#bNum").textContent=bPos+1;$("#bScore").textContent=bScore;$("#buildProg").style.width=(bPos/bList.length*100)+"%";
  const decoys=shuffle(ALL_ING.filter(i=>!c.build.includes(i))).slice(0,5);
  const tiles=shuffle([...c.build,...decoys]);
  const glassOpts=shuffle([c.glass,...shuffle(ALL_GLASS.filter(g=>g!==c.glass)).slice(0,3)]);
  const garnOpts=shuffle([c.garnish,...shuffle(ALL_GARN.filter(g=>g!==c.garnish)).slice(0,3)]);
  $("#buildBody").innerHTML=`<div class="build-card">
    <div class="build-sub">Build the drink${c.price?" · "+esc(c.price):""}</div>
    <div class="build-head">${esc(c.n)}</div>
    <div class="section-lbl">Your Pour</div><div class="glassbox empty" id="glassbox"></div>
    <div class="section-lbl">Ingredients — tap to add</div>
    <div class="tiles2" id="tiles">${tiles.map(t=>`<button class="tile2" data-ing="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="section-lbl">Glassware</div>
    <div class="grid2" id="glassOpts">${glassOpts.map(g=>`<button class="opt" data-glass="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div class="section-lbl">Garnish</div>
    <div class="opts" id="garnOpts">${garnOpts.map(g=>`<button class="opt" data-garnish="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div style="height:18px"></div>
    <button class="btn primary" id="checkBuild">Check My Build</button>
    <div id="buildReveal"></div></div>`;
  $("#tiles").querySelectorAll(".tile2").forEach(b=>b.onclick=()=>toggleIng(b));
  $("#glassOpts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOne("glass",b,"#glassOpts"));
  $("#garnOpts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOne("garnish",b,"#garnOpts"));
  $("#checkBuild").onclick=()=>checkBuild(c);
}
function toggleIng(btn){
  if(bState.checked)return;
  const ing=btn.dataset.ing;
  if(bState.added.includes(ing)){bState.added=bState.added.filter(x=>x!==ing);btn.classList.remove("used")}
  else{bState.added.push(ing);btn.classList.add("used")}
  drawPour();
}
function drawPour(){
  const gb=$("#glassbox"); gb.classList.toggle("empty",!bState.added.length);
  gb.innerHTML=bState.added.map(ing=>`<span class="pour" data-ing="${esc(ing)}">${esc(ing)} <span class="x">×</span></span>`).join("");
  gb.querySelectorAll(".pour").forEach(p=>p.onclick=()=>{
    if(bState.checked)return;
    bState.added=bState.added.filter(x=>x!==p.dataset.ing);
    $("#tiles").querySelector(`[data-ing="${p.dataset.ing.replace(/"/g,'\\"')}"]`)?.classList.remove("used");
    drawPour();
  });
}
function pickOne(key,btn,wrap){
  if(bState.checked)return; bState[key]=btn.dataset[key];
  document.querySelector(wrap).querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===btn));
}
function checkBuild(c){
  if(bState.checked)return; bState.checked=true;
  const ingOK=c.build.length===bState.added.length&&c.build.every(i=>bState.added.includes(i));
  const glassOK=bState.glass===c.glass, garnOK=bState.garnish===c.garnish, perfect=ingOK&&glassOK&&garnOK;
  if(perfect)bScore++; $("#bScore").textContent=bScore;
  $("#tiles").querySelectorAll(".tile2").forEach(b=>b.disabled=true);
  document.querySelectorAll("#glassOpts .opt,#garnOpts .opt").forEach(b=>b.disabled=true);
  const mark=ok=>`<span class="mk ${ok?'ok':'no'}">${ok?'✓':'✗'}</span>`;
  $("#buildReveal").innerHTML=`<div class="reveal">
    <div class="line">${mark(ingOK)}<span><b>Ingredients</b>${ingOK?' — nailed it':' — not quite'}</span></div>
    ${ingOK?'':`<div class="answer">${esc(c.build.join("\n"))}</div>`}
    <div class="line">${mark(glassOK)}<span><b>Glass</b> — ${esc(c.glass)}</span></div>
    <div class="line">${mark(garnOK)}<span><b>Garnish</b> — ${esc(c.garnish)}</span></div>
    ${METHODS[c.n]?`<div class="answer" style="padding-left:0;margin-top:8px;color:var(--cream)"><span style="color:var(--gold);font-weight:700">Method:</span> ${esc(METHODS[c.n])}</div>`:""}
    <div style="height:14px"></div>
    <div class="feedback ${perfect?'ok':'no'}" style="text-align:left">${perfect?'Perfect build 🌺':'Review it and keep moving →'}</div>
    <div style="height:12px"></div>
    <button class="btn primary" id="nextBuild">${bPos+1>=bList.length?'See results':'Next drink →'}</button></div>`;
  $("#nextBuild").onclick=()=>{bPos++;renderBuild()};
}
function buildResults(){
  const pct=Math.round(bScore/bList.length*100);
  const msg=pct>=90?"You can make the whole menu. 🍹":pct>=60?"Strong — drill the misses.":"Keep building, it'll click.";
  $("#buildProg").style.width="100%";
  $("#buildBody").innerHTML=`<div class="build-card results"><div class="big">${bScore}/${bList.length}</div><p>perfect builds · ${pct}%<br>${msg}</p><button class="btn primary" id="bAgain">Run it again</button></div>`;
  $("#bAgain").onclick=startBuild;
}

renderStudyChips();
</script>
